name: Module Test

on: 
  [push]

jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest] 
        python-version: 
          - "3.10" 
          - "3.11"
          - "3.12"
          
    name: Test
    runs-on:  ${{ matrix.os }}
    
    env:
      MODE: "dev"
      COLORTERM: "truecolor"

    steps:
      - name: checkout code
        uses: actions/checkout@v4.1.7
        
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest setuptools>=42.0.0
          pip install .
          pip install numpy

      - name: Run Test
        run: pytest 